<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPPO STUDIO v0.2</title>
<style>
:root{--bg:#0b1020;--panel:#141c30;--panel2:#1b2740;--line:#2a3855;--text:#edf3ff;--muted:#91a2c2;--accent:#7c5cff;--cyan:#38d9ff;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial;overflow:hidden}
header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#10182a;border-bottom:1px solid var(--line)}
.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--cyan)}.ver{font-size:11px;color:var(--muted);margin-left:8px}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 12px;font-weight:650}
button.primary{background:var(--accent);border-color:var(--accent)}button.run{background:#13794f;border-color:#13794f}
main{height:calc(100dvh - 54px);display:grid;grid-template-columns:230px minmax(0,1fr) 250px;gap:8px;padding:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0;overflow:auto}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:12px;margin:0;border-bottom:1px solid var(--line)}
.tools{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.tree{padding:8px}.treeitem{padding:9px;border-radius:7px;cursor:pointer;color:#d9e5ff}.treeitem.active{background:#29365a;outline:1px solid #5265a0}.treeitem small{color:var(--muted)}
.center{display:grid;grid-template-rows:minmax(180px,1fr) 230px;gap:8px;min-height:0}
.viewport{position:relative;background:radial-gradient(ellipse at center,#1a2945,#0b1222 72%);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
#view{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:12px;top:10px;color:var(--muted);font-size:11px;pointer-events:none}
.bottom{display:grid;grid-template-columns:1fr;min-height:0}.editor{height:100%;display:flex;flex-direction:column}
.editorbar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);gap:6px}.editorbar strong{font-size:12px}
textarea{width:100%;height:100%;resize:none;background:#0b1222;color:#d7e6ff;border:0;outline:0;padding:12px;font:13px/1.55 ui-monospace,monospace;tab-size:2}
.props{padding:10px;display:grid;gap:9px}label{display:grid;gap:4px;color:var(--muted);font-size:11px}input{min-width:0;width:100%;background:#0b1222;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.msg{padding:8px 11px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);white-space:pre-wrap;max-height:60px;overflow:auto}
@media(max-width:760px){main{grid-template-columns:145px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 220px;padding:5px;gap:5px}.right{display:none}.center{grid-column:2;grid-row:1 / span 2;grid-template-rows:minmax(180px,1fr) 220px}.left{grid-column:1;grid-row:1 / span 2}.tools{grid-template-columns:1fr}.treeitem{font-size:12px;padding:7px}header{padding:0 9px}.ver{display:none}button{padding:8px;font-size:12px}}
</style>
</head>
<body>
<header><div><span class="brand">CLIPPO <span>STUDIO</span></span><span class="ver">BETA v0.2 · SCRIPT BUILDER</span></div><div style="display:flex;gap:6px"><button id="add" class="primary">＋ Part</button><button id="run" class="run">▶ Run</button></div></header>
<main>
<section class="panel left"><h3>Explorer</h3><div class="tools"><button id="sphere">＋ Sphere</button><button id="cylinder">＋ Cylinder</button><button id="delete">Delete</button><button id="clear">Clear</button></div><div id="tree" class="tree"></div></section>
<section class="center">
 <div class="viewport"><div class="hint">3D VIEW · drag to rotate · pinch/scroll to zoom</div><canvas id="view"></canvas></div>
 <div class="panel bottom editor"><div class="editorbar"><strong>Luau Script (supported subset)</strong><div><button id="example">Example</button><button id="export">Export JSON</button></div></div><textarea id="code" spellcheck="false">local part = Instance.new("Part")
part.Name = "MyPart"
part.Size = Vector3.new(10, 2, 10)
part.Position = Vector3.new(0, 5, 0)
part.Anchored = true
part.Parent = workspace</textarea><div id="status" class="msg">Ready. Tap Run to execute the supported script.</div></div>
</section>
<section class="panel right"><h3>Properties</h3><div id="props" class="props"><small style="color:var(--muted)">Select an object in Explorer or the viewport.</small></div></section>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#view'), scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1222);
const camera=new THREE.PerspectiveCamera(55,1,.1,1000);camera.position.set(18,16,22);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.HemisphereLight(0xffffff,0x405070,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(10,20,12);scene.add(light);
const grid=new THREE.GridHelper(100,100,0x526487,0x273651);scene.add(grid);
const root=new THREE.Group();scene.add(root);
let objects=[],selected=null,rotY=.7,rotX=.55,dist=34,drag=null;
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(r.height,1);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);
function cam(){camera.position.set(Math.sin(rotY)*Math.cos(rotX)*dist,Math.sin(rotX)*dist,Math.cos(rotY)*Math.cos(rotX)*dist);camera.lookAt(0,2,0)}cam();
function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(drag.moved){rotY-=dx*.008;rotX=Math.max(-1.2,Math.min(1.2,rotX+dy*.008));cam()}drag.x=e.clientX;drag.y=e.clientY});
canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const rect=canvas.getBoundingClientRect(),mouse=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height)*2+1),ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(root.children,true);if(hits.length){let o=hits[0].object;while(o.parent&&o.parent!==root)o=o.parent;const item=objects.find(x=>x.mesh===o);if(item)select(item)}}drag=null});
canvas.addEventListener('wheel',e=>{dist=Math.max(7,Math.min(100,dist+e.deltaY*.035));cam()},{passive:true});
function make(type='Part',name){let geo=type==='Sphere'?new THREE.SphereGeometry(.5,24,16):type==='Cylinder'?new THREE.CylinderGeometry(.5,.5,1,24):new THREE.BoxGeometry(1,1,1);let mat=new THREE.MeshStandardMaterial({color:0x7c5cff,roughness:.65});let mesh=new THREE.Mesh(geo,mat);mesh.userData.kind=type;root.add(mesh);let item={id:crypto.randomUUID(),type,name:name||type,mesh,position:[0,1,0],size:[4,2,4],rotation:[0,0,0],anchored:true};objects.push(item);apply(item);select(item);renderTree();return item}
function apply(o){o.mesh.position.set(...o.position);o.mesh.rotation.set(...o.rotation.map(v=>v*Math.PI/180));if(o.type==='Part')o.mesh.scale.set(o.size[0],o.size[1],o.size[2]);else if(o.type==='Sphere')o.mesh.scale.set(o.size[0],o.size[1],o.size[2]);else o.mesh.scale.set(o.size[0],o.size[1],o.size[2]);}
function select(o){selected=o;renderTree();renderProps()}
function renderTree(){const t=document.querySelector('#tree');t.innerHTML='';if(!objects.length){t.innerHTML='<small style="color:var(--muted)">Workspace is empty</small>';return}objects.forEach(o=>{let d=document.createElement('div');d.className='treeitem'+(selected===o?' active':'');d.textContent='▰  '+o.name;d.onclick=()=>select(o);t.append(d)})}
function field(label,key,idx){let l=document.createElement('label');l.textContent=label;let input=document.createElement('input');input.value=idx===undefined?selected[key]:selected[key][idx];input.type=key==='color'?'color':'text';if(key==='color')input.value='#'+selected.mesh.material.color.getHexString();input.onchange=()=>{if(key==='color')selected.mesh.material.color.set(input.value);else if(idx===undefined)selected[key]=input.value;else selected[key][idx]=Number(input.value)||0;if(key!=='color')apply(selected);if(key==='name')renderTree()};l.append(input);return l}
function renderProps(){let p=document.querySelector('#props');p.innerHTML='';if(!selected){p.textContent='No selection';return}p.append(field('Name','name'),field('Color','color'));[['Position','position'],['Size','size'],['Rotation (degrees)','rotation']].forEach(([title,key])=>{let l=document.createElement('label');l.textContent=title;let r=document.createElement('div');r.className='row3';for(let i=0;i<3;i++){let x=document.createElement('input');x.type='number';x.step='.5';x.value=selected[key][i];x.onchange=()=>{selected[key][i]=Number(x.value)||0;apply(selected)};r.append(x)}l.append(r);p.append(l)});let a=document.createElement('label');a.textContent='Anchored';let c=document.createElement('input');c.type='checkbox';c.checked=selected.anchored;c.onchange=()=>selected.anchored=c.checked;a.append(c);p.append(a)}
function report(s){document.querySelector('#status').textContent=s}
function addPart(t='Part'){make(t)}
document.querySelector('#add').onclick=()=>addPart();document.querySelector('#sphere').onclick=()=>addPart('Sphere');document.querySelector('#cylinder').onclick=()=>addPart('Cylinder');
document.querySelector('#delete').onclick=()=>{if(!selected)return;root.remove(selected.mesh);objects=objects.filter(x=>x!==selected);selected=null;renderTree();renderProps()};
document.querySelector('#clear').onclick=()=>{objects.forEach(o=>root.remove(o.mesh));objects=[];selected=null;renderTree();renderProps();report('Workspace cleared.')};
document.querySelector('#example').onclick=()=>{document.querySelector('#code').value=`local part = Instance.new("Part")\npart.Name = "MyPart"\npart.Size = Vector3.new(10, 2, 10)\npart.Position = Vector3.new(0, 5, 0)\npart.Anchored = true\npart.Parent = workspace`};
function vector(s){let m=s.match(/^Vector3\.new\(\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)$/);return m?m.slice(1).map(Number):null}
function runLimited(src){
 // Intentionally interpret only a small allowlisted grammar; never eval user code.
 const lines=src.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('--'));
 let vars={},created=[],current=null;
 for(let n=0;n<lines.length;n++){
  let s=lines[n],m;
  if((m=s.match(/^(?:local\s+)?([A-Za-z_]\w*)\s*=\s*Instance\.new\("(Part|Sphere|Cylinder)"\)$/))){current=make(m[2],m[2]);vars[m[1]]=current;created.push(current);continue}
  if((m=s.match(/^([A-Za-z_]\w*)\.(Name|Anchored|Parent|Size|Position)\s*=\s*(.+)$/))){
   let o=vars[m[1]];if(!o)throw Error(`Line ${n+1}: unknown object "${m[1]}"`);
   let key=m[2],v=m[3];
   if(key==='Name'){let q=v.match(/^"([^"]*)"$/);if(!q)throw Error(`Line ${n+1}: Name must be text in quotes`);o.name=q[1]}
   else if(key==='Anchored'){if(v!=='true'&&v!=='false')throw Error(`Line ${n+1}: Anchored must be true or false`);o.anchored=v==='true'}
   else if(key==='Parent'){if(v!=='workspace')throw Error(`Line ${n+1}: only workspace parenting is supported in v0.2`)}
   else {let vec=vector(v);if(!vec)throw Error(`Line ${n+1}: ${key} must use Vector3.new(x, y, z)`);o[key.toLowerCase()]=vec;apply(o)}
   renderTree();continue
  }
  throw Error(`Line ${n+1}: unsupported syntax. This beta supports Instance.new, Name, Size, Position, Anchored and Parent = workspace.`);
 }
 renderTree();if(created.length)select(created[created.length-1]);return created.length;
}
document.querySelector('#run').onclick=()=>{try{let n=runLimited(document.querySelector('#code').value);report(`Run complete: created ${n} object(s). Supported Luau subset only.`)}catch(e){report('Script stopped safely: '+e.message)}};
document.querySelector('#export').onclick=()=>{let data={format:'CLIPPO_SCENE_V1',objects:objects.map(o=>({type:o.type,name:o.name,position:o.position,size:o.size,rotation:o.rotation,anchored:o.anchored,color:'#'+o.mesh.material.color.getHexString()}))};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clippo-scene.json';a.click();URL.revokeObjectURL(a.href);report('Exported CLIPPO scene JSON. This is not a Roblox model file yet.')};
make('Part','Baseplate');selected.position=[0,-.5,0];selected.size=[20,1,20];selected.mesh.material.color.set(0x283a59);apply(selected);renderTree();renderProps();
</script></body></html>
